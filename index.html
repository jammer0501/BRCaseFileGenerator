<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e14">
  <title>Blade Runner Case File Generator</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap">

  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/blade-runner.css">
</head>
<body class="mode-blade-runner">

  <div class="app">

    <header class="app-header">
      <h1 class="app-title">
        <span class="app-title-main">Blade Runner</span>
        <span class="app-title-sub">Case File Generator</span>
      </h1>
    </header>

    <main class="app-main">

      <div class="roll-section">
        <button class="roll-btn" id="generate-btn">Generate Case</button>
      </div>

      <section class="result" id="result" hidden aria-live="polite" aria-atomic="true">
        <pre class="case-output" id="case-output"></pre>
      </section>

    </main>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
